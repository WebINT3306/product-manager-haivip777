<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Danh sách Sản phẩm</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        line-height: 1.6;
      }

      h2 {
        color: #333;
      }

      .form-container {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
      }

      .form-group {
        margin-bottom: 10px;
      }

      label {
        display: inline-block;
        width: 120px;
      }

      input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 250px;
      }

      button#btn-add {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button#btn-add:hover {
        background-color: #218838;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }

      thead th {
        background-color: #007bff;
        color: white;
        cursor: pointer;
        user-select: none;
      }

      tbody tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tbody tr:hover {
        background-color: #e2e2e2;
      }

      .sort-icon {
        margin-left: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Thêm sản phẩm mới</h2>
    <div class="form-container">
      <div class="form-group">
        <label>Tên sản phẩm:</label>
        <input type="text" id="input-name" placeholder="Ít nhất 3 ký tự" />
      </div>
      <div class="form-group">
        <label>Danh mục:</label>
        <input type="text" id="input-category" />
      </div>
      <div class="form-group">
        <label>Đơn giá:</label>
        <input type="number" id="input-price" min="1" />
      </div>
      <div class="form-group">
        <label>Số lượng:</label>
        <input type="number" id="input-quantity" min="1" />
      </div>
      <button id="btn-add">Thêm sản phẩm</button>
    </div>

    <hr />

    <h2>Danh sách sản phẩm</h2>
    <table id="product-table">
      <thead>
        <tr>
          <th>STT</th>
          <th id="th-name">Tên sản phẩm <span class="sort-icon"></span></th>
          <th>Danh mục</th>
          <th>Đơn giá</th>
          <th>Số lượng</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      let productList = [];
      let sortDirection = 0;

      const tableBody = document.querySelector("#product-table tbody");
      const thName = document.getElementById("th-name");

      function loadProducts() {
        const xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            productList = JSON.parse(xhr.responseText);
            renderTable(productList);
          }
        };
        xhr.open("GET", "products.json", true);
        xhr.send();
      }

      function renderTable(data) {
        tableBody.innerHTML = "";
        data.forEach((product, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${product.name}</td>
                    <td>${product.category || ""}</td>
                    <td>${Number(product.price).toLocaleString()}</td>
                    <td>${product.quantity}</td>
                `;
          tableBody.appendChild(row);
        });
      }

      thName.addEventListener("click", () => {
        if (sortDirection === 1) {
          sortDirection = -1;
          productList.sort((a, b) => b.name.localeCompare(a.name));
          thName.querySelector(".sort-icon").innerText = "▼";
        } else {
          sortDirection = 1;
          productList.sort((a, b) => a.name.localeCompare(b.name));
          thName.querySelector(".sort-icon").innerText = "▲";
        }
        renderTable(productList);
      });

      document.getElementById("btn-add").addEventListener("click", () => {
        const name = document.getElementById("input-name").value.trim();
        const category = document.getElementById("input-category").value.trim();
        const price = parseFloat(document.getElementById("input-price").value);
        const quantity = parseInt(
          document.getElementById("input-quantity").value,
        );

        if (name.length < 3) {
          alert("Tên sản phẩm phải có ít nhất 3 ký tự!");
          return;
        }
        if (isNaN(price) || price <= 0) {
          alert("Đơn giá phải là số dương!");
          return;
        }
        if (isNaN(quantity) || quantity < 1) {
          alert("Số lượng phải là số nguyên >= 1!");
          return;
        }

        const newProduct = {
          id: Date.now(),
          name: name,
          category: category,
          price: price,
          quantity: quantity,
        };

        productList.push(newProduct);
        renderTable(productList);

        document.getElementById("input-name").value = "";
        document.getElementById("input-category").value = "";
        document.getElementById("input-price").value = "";
        document.getElementById("input-quantity").value = "";
      });

      window.onload = loadProducts;
    </script>
  </body>
</html>
